# Java Util Logging configuration for the Quiz Portal
# Place this file in src/main/resources/

# Root logger — INFO level, console handler
handlers=java.util.logging.ConsoleHandler
.level=INFO

# Application-specific loggers
com.quizportal.level=INFO
com.quizportal.service.level=INFO
com.quizportal.dao.level=WARNING
com.quizportal.filter.level=INFO
com.quizportal.servlet.level=INFO

# Console handler settings
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Format: timestamp [LEVEL] class.method: message
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %2$s: %5$s %6$s%n
